<!DOCTYPE html>
<!-- Created: 2026-10-29 21:10 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handwritten Digit Recognition (MNIST)</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin: 24px; }
  canvas { border: 2px solid #000; cursor: crosshair; touch-action: none; }
  button { font-size: 16px; padding: 6px 18px; margin: 8px 4px; }
  #prediction { font-size: 28px; font-weight: bold; margin-top: 12px; }
  #details { color: #666; margin-top: 4px; }
</style>
</head>
<body>
<h2>Draw a digit (0-9)</h2>
<canvas id="drawing-canvas" width="280" height="280"></canvas>
<div>
  <button id="recognize-button">Recognize</button>
  <button id="clear-button">Clear</button>
</div>
<div id="prediction">Loading model...</div>
<div id="details"></div>

<script>
const CANVAS_SIZE = 280;
const BRUSH_RADIUS = 10;
const INK_THRESHOLD = 30;

const drawingCanvas = document.getElementById("drawing-canvas");
const drawingContext = drawingCanvas.getContext("2d", { willReadFrequently: true });
const predictionLabel = document.getElementById("prediction");
const detailsLabel = document.getElementById("details");

let modelLayers = null;
let isDrawing = false;
let lastPoint = null;

function clearCanvas() {
  drawingContext.fillStyle = "white";
  drawingContext.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  drawingContext.strokeStyle = "black";
  drawingContext.fillStyle = "black";
  drawingContext.lineWidth = BRUSH_RADIUS * 2;
  drawingContext.lineCap = "round";
  drawingContext.lineJoin = "round";
}

function getPointerPosition(event) {
  const bounds = drawingCanvas.getBoundingClientRect();
  return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
}

drawingCanvas.addEventListener("pointerdown", (event) => {
  isDrawing = true;
  drawingCanvas.setPointerCapture(event.pointerId);
  lastPoint = getPointerPosition(event);
  drawingContext.beginPath();
  drawingContext.arc(lastPoint.x, lastPoint.y, BRUSH_RADIUS, 0, 2 * Math.PI);
  drawingContext.fill();
});

drawingCanvas.addEventListener("pointermove", (event) => {
  if (!isDrawing) return;
  const currentPoint = getPointerPosition(event);
  drawingContext.beginPath();
  drawingContext.moveTo(lastPoint.x, lastPoint.y);
  drawingContext.lineTo(currentPoint.x, currentPoint.y);
  drawingContext.stroke();
  lastPoint = currentPoint;
});

drawingCanvas.addEventListener("pointerup", () => {
  if (!isDrawing) return;
  isDrawing = false;
  recognize();
});

document.getElementById("clear-button").addEventListener("click", () => {
  clearCanvas();
  predictionLabel.textContent = "Prediction: -";
  detailsLabel.textContent = "";
});
document.getElementById("recognize-button").addEventListener("click", recognize);

// Convert the drawing into a 784-vector in MNIST style: white digit on black,
// fit into a 20x20 box (aspect preserved), centered by center of mass in 28x28.
function preprocessDrawing() {
  const pixels = drawingContext.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;
  let minX = CANVAS_SIZE, minY = CANVAS_SIZE, maxX = -1, maxY = -1;
  for (let y = 0; y < CANVAS_SIZE; y++) {
    for (let x = 0; x < CANVAS_SIZE; x++) {
      const inkValue = 255 - pixels[(y * CANVAS_SIZE + x) * 4];
      if (inkValue > INK_THRESHOLD) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;

  const cropWidth = maxX - minX + 1;
  const cropHeight = maxY - minY + 1;
  const scale = 20 / Math.max(cropWidth, cropHeight);
  const scaledWidth = Math.max(1, Math.round(cropWidth * scale));
  const scaledHeight = Math.max(1, Math.round(cropHeight * scale));

  const digitCanvas = document.createElement("canvas");
  digitCanvas.width = 28;
  digitCanvas.height = 28;
  const digitContext = digitCanvas.getContext("2d", { willReadFrequently: true });
  digitContext.fillStyle = "white";
  digitContext.fillRect(0, 0, 28, 28);
  digitContext.imageSmoothingEnabled = true;
  digitContext.imageSmoothingQuality = "high";
  digitContext.drawImage(
    drawingCanvas, minX, minY, cropWidth, cropHeight,
    Math.floor((28 - scaledWidth) / 2), Math.floor((28 - scaledHeight) / 2),
    scaledWidth, scaledHeight
  );

  const digitPixels = digitContext.getImageData(0, 0, 28, 28).data;
  const centeredImage = new Float32Array(28 * 28);
  let totalMass = 0, massX = 0, massY = 0;
  for (let y = 0; y < 28; y++) {
    for (let x = 0; x < 28; x++) {
      const inkValue = 255 - digitPixels[(y * 28 + x) * 4];
      centeredImage[y * 28 + x] = inkValue;
      totalMass += inkValue;
      massX += inkValue * x;
      massY += inkValue * y;
    }
  }

  const shiftX = Math.round(13.5 - massX / totalMass);
  const shiftY = Math.round(13.5 - massY / totalMass);
  const shiftedImage = new Float32Array(28 * 28);
  for (let y = 0; y < 28; y++) {
    for (let x = 0; x < 28; x++) {
      const sourceX = x - shiftX;
      const sourceY = y - shiftY;
      if (sourceX >= 0 && sourceX < 28 && sourceY >= 0 && sourceY < 28) {
        shiftedImage[y * 28 + x] = centeredImage[sourceY * 28 + sourceX] / 255;
      }
    }
  }
  return shiftedImage;
}

// Forward pass of the exported scikit-learn MLP: ReLU hidden layers, softmax output.
function predictProbabilities(inputVector) {
  let activations = inputVector;
  modelLayers.forEach((layer, layerIndex) => {
    const outputCount = layer.biases.length;
    const outputs = Float32Array.from(layer.biases);
    for (let inputIndex = 0; inputIndex < activations.length; inputIndex++) {
      const activation = activations[inputIndex];
      if (activation === 0) continue;
      const weightRow = layer.weights[inputIndex];
      for (let outputIndex = 0; outputIndex < outputCount; outputIndex++) {
        outputs[outputIndex] += activation * weightRow[outputIndex];
      }
    }
    const isLastLayer = layerIndex === modelLayers.length - 1;
    if (!isLastLayer) {
      for (let i = 0; i < outputCount; i++) outputs[i] = Math.max(0, outputs[i]);
    }
    activations = outputs;
  });

  const maxLogit = Math.max(...activations);
  const exponentials = Array.from(activations, (value) => Math.exp(value - maxLogit));
  const exponentialSum = exponentials.reduce((sum, value) => sum + value, 0);
  return exponentials.map((value) => value / exponentialSum);
}

function recognize() {
  if (!modelLayers) return;
  const inputVector = preprocessDrawing();
  if (!inputVector) {
    predictionLabel.textContent = "Prediction: -";
    detailsLabel.textContent = "Canvas is empty";
    return;
  }
  const probabilities = predictProbabilities(inputVector);
  const topThree = probabilities
    .map((probability, digit) => ({ digit, probability }))
    .sort((a, b) => b.probability - a.probability)
    .slice(0, 3);
  predictionLabel.textContent =
    `Prediction: ${topThree[0].digit} (${(topThree[0].probability * 100).toFixed(1)}%)`;
  detailsLabel.textContent = "Top 3: " + topThree
    .map((entry) => `${entry.digit}: ${(entry.probability * 100).toFixed(1)}%`)
    .join("   ");
}

clearCanvas();
fetch("model.json")
  .then((response) => response.json())
  .then((modelData) => {
    modelLayers = modelData.layers;
    predictionLabel.textContent = "Prediction: -";
  })
  .catch(() => {
    predictionLabel.textContent = "Failed to load model.json (open via the local server, not file://)";
  });
</script>
</body>
</html>
