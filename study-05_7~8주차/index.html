<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- 시작 화면 -->
    <section id="start-screen" class="card">
      <h1>상식 퀴즈</h1>
      <p class="sub">한국사 · 과학 · 지리 · 일반상식<br>총 40문제</p>
      <form id="start-form" novalidate>
        <label for="nickname">닉네임 (1~10자)</label>
        <input id="nickname" type="text" autocomplete="off" placeholder="닉네임을 입력하세요">
        <p id="nickname-error" class="error" role="alert"></p>
        <button type="submit" class="btn primary">시작하기</button>
      </form>
      <button type="button" id="ranking-btn-start" class="btn secondary">순위표 보기</button>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="quiz-screen" class="card" hidden>
      <div class="quiz-header">
        <span id="category" class="badge"></span>
        <span id="progress" class="progress-text"></span>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <h2 id="question" class="question"></h2>
      <ul id="choices" class="choices"></ul>
      <div id="feedback" class="feedback" hidden>
        <p id="result" class="result"></p>
        <p id="explanation" class="explanation"></p>
      </div>
      <button id="next-btn" class="btn primary" hidden>다음</button>
    </section>

    <!-- 결과 화면 (순위는 다음 단계) -->
    <section id="end-screen" class="card" hidden>
      <h1>퀴즈 결과</h1>
      <p id="end-message" class="sub"></p>
      <p id="total-score" class="total-score"></p>
      <p id="end-rank" class="my-rank"></p>
      <table class="stats">
        <thead>
          <tr><th>카테고리</th><th>정답 수</th><th>정답률</th></tr>
        </thead>
        <tbody id="category-stats"></tbody>
      </table>
      <button type="button" id="ranking-btn-end" class="btn secondary">순위표 보기</button>
      <button type="button" id="restart-btn" class="btn primary">다시 하기</button>
    </section>

    <!-- 순위표 화면 -->
    <section id="ranking-screen" class="card" hidden>
      <h1>순위표</h1>
      <p class="sub">상위 10명 · 동점이면 먼저 달성한 기록이 위</p>
      <p id="my-rank" class="my-rank" hidden></p>
      <p id="ranking-empty" class="empty" hidden>아직 기록이 없습니다.</p>
      <table id="ranking-table" class="stats ranking" hidden>
        <thead>
          <tr><th>순위</th><th>닉네임</th><th>점수</th><th>일시</th></tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
      <button type="button" id="ranking-back-btn" class="btn primary">돌아가기</button>
    </section>
  </main>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
